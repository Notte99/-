<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nemo Shop – เทมเพลตสลิป</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#e8f6ff;--card:#fff;--tx:#3a2a35;--pk:#f06292;--pk2:#fde4ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14232e;--card:#1f3140;--tx:#f5e6ee;--pk2:#3a2733}}
:root[data-theme="dark"]{--bg:#14232e;--card:#1f3140;--tx:#f5e6ee;--pk2:#3a2733}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Mali','Noto Sans Thai','Sarabun',system-ui,sans-serif;padding:14px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
canvas{width:100%;height:auto;border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.18);background:#fff;cursor:pointer;display:block}
.card{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
label{font-weight:600;font-size:15px}
input[type=text]{width:100%;padding:12px;border-radius:12px;border:2px solid var(--pk);background:var(--pk2);color:var(--tx);font:inherit;font-size:16px}
button{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:14px;padding:13px;background:var(--pk);color:#fff;cursor:pointer}
button.sec{background:var(--pk2);color:var(--pk);border:2px solid var(--pk)}
button:disabled{opacity:.45}
#out{display:none;text-align:center;font-size:14px}#out img{width:100%;border-radius:12px;margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1;min-width:110px;padding:10px;font-size:14px}
button.on{background:var(--pk);color:#fff}
#cp{display:none;flex-direction:column;gap:8px}
.hint{font-size:13px;opacity:.75;text-align:center}
</style></head><body>
<div class="wrap">
<canvas id="c" width="1351" height="1944" aria-label="ตัวอย่างภาพ"></canvas>
<div class="card">
<button class="sec" id="pick">📷 เลือกรูปสลิป</button>
<input type="file" id="file" accept="image/*" hidden>
<button class="sec" id="cz">🙈 โหมดเซ็นเซอร์ (ปิดอยู่)</button>
<div id="cp">
<div class="hint" style="opacity:1">ลากนิ้วบนสลิปเพื่อคลุมส่วนที่ต้องการ · แตะที่แถบที่คลุมไว้เพื่อลบออก</div>
<div class="row"><button class="sec on" id="s1">▉ ชมพู</button><button class="sec" id="s3">■ ดำ</button><button class="sec" id="s2">▦ โมเสก</button></div>
<button id="pa">⚡ ปิดอัตโนมัติ: ชื่อ + QR + เลขที่รายการ (สลิป K+)</button>
<div class="row"><button class="sec" id="pn">ชื่อผู้โอน</button><button class="sec" id="pq">QR สแกน</button><button class="sec" id="pr">เลขที่รายการ</button></div>
<div class="row"><button class="sec" id="un">↩️ ย้อนกลับ</button><button class="sec" id="cl">🗑 ล้างทั้งหมด</button></div>
</div>
<label for="note">โน้ต</label>
<input type="text" id="note" maxlength="80" placeholder="พิมพ์โน้ตตรงนี้ เช่น ขอบคุณครับ 💕">
<button id="save" disabled>💾 บันทึกลงแกลเลอรี่</button>
<button class="sec" id="dl" disabled>⬇️ ดาวน์โหลดเป็นไฟล์ PNG</button>
<button class="sec" id="rs">🔄 เริ่มใหม่ (ล้างสลิปและโน้ต)</button>
<div id="out"></div>
<div class="hint">แตะที่กรอบสลิปเพื่อเลือกรูปได้เหมือนกัน</div>
</div></div>

const c=document.getElementById('c'),x=c.getContext('2d');
const SX=175,SY=416,SW=1000,SH=1160,NX=175,NY=1600,NW=1000,NH=136;
const FONT="'Mali','Noto Sans Thai','Sarabun',sans-serif";
let rects=[],cur=null,censor=false,style='s',sb=null;
let tpl=new Image(),slip=null,ready=false;
tpl.onload=()=>{ready=true;draw()};tpl.src=TPL;
function rr(a,b,w,h,r){x.beginPath();x.roundRect?x.roundRect(a,b,w,h,r):x.rect(a,b,w,h)}
function draw(){
 if(!ready)return;
 x.clearRect(0,0,c.width,c.height);x.drawImage(tpl,0,0);
 if(slip){
  const s=Math.min(SW/slip.width,SH/slip.height),w=slip.width*s,h=slip.height*s,a=SX+(SW-w)/2,b=SY+(SH-h)/2;
  x.save();x.shadowColor='rgba(200,100,140,.45)';x.shadowBlur=26;x.shadowOffsetY=8;rr(a,b,w,h,30);x.fillStyle='#fff';x.fill();x.restore();
  sb={a,b,w,h};x.save();rr(a,b,w,h,30);x.clip();x.drawImage(slip,a,b,w,h);drawCensor(a,b,w,h);x.restore();
 }else{
  x.save();rr(SX,SY,SW,SH,30);x.fillStyle='rgba(255,255,255,.7)';x.fill();x.setLineDash([22,16]);x.lineWidth=5;x.strokeStyle='#f48fb1';x.stroke();x.restore();
  x.fillStyle='#ec5c8c';x.font='600 54px '+FONT;x.textAlign='center';x.fillText('แตะเพื่อเลือกรูปสลิป',SX+SW/2,SY+SH/2);x.textAlign='left';
 }
 rr(NX,NY,NW,NH,28);x.fillStyle='#fff';x.fill();x.lineWidth=4;x.strokeStyle='#f48fb1';x.stroke();
 x.fillStyle='#ec5c8c';x.font='600 34px '+FONT;x.textBaseline='alphabetic';x.fillText('โน้ต :',NX+28,NY+46);
 x.save();x.setLineDash([18,12]);x.lineWidth=4;x.strokeStyle='#f4aac4';x.beginPath();x.moveTo(NX+28,NY+NH-26);x.lineTo(NX+NW-28,NY+NH-26);x.stroke();x.restore();
 const t=document.getElementById('note').value.trim();
 if(t){let fs=44;x.fillStyle='#4a3340';
  do{x.font='500 '+fs+'px '+FONT;fs-=2}while(x.measureText(t).width>NW-56&&fs>20);
  x.fillText(t,NX+28,NY+NH-36);}
 document.getElementById('save').disabled=!slip;document.getElementById('dl').disabled=!slip;prep();
}

function drawCensor(a,b,w,h){
 for(const r of cur?rects.concat([cur]):rects){
  const px=a+r.x*w,py=b+r.y*h,pw=r.w*w,ph=r.h*h;
  if(r.s==='m'){
   const sw=r.w*slip.width,sh=r.h*slip.height,tw=Math.max(2,Math.ceil(sw/40)),th=Math.max(2,Math.ceil(sh/40));
   const t=document.createElement('canvas');t.width=tw;t.height=th;
   t.getContext('2d').drawImage(slip,r.x*slip.width,r.y*slip.height,sw,sh,0,0,tw,th);
   x.imageSmoothingEnabled=false;x.drawImage(t,0,0,tw,th,px,py,pw,ph);x.imageSmoothingEnabled=true;
  }else{x.fillStyle=r.s==='k'?'#1b1b1f':'#f48fb1';x.fillRect(px,py,pw,ph);}
  if(r===cur){x.save();x.setLineDash([12,8]);x.lineWidth=4;x.strokeStyle='#fff';x.strokeRect(px,py,pw,ph);x.restore();}
 }
}
function pos(e){const q=c.getBoundingClientRect();return{X:(e.clientX-q.left)*c.width/q.width,Y:(e.clientY-q.top)*c.height/q.height}}
let st=null;
c.addEventListener('pointerdown',e=>{
 if(!censor||!slip||!sb)return;const p=pos(e);
 if(p.X<sb.a||p.X>sb.a+sb.w||p.Y<sb.b||p.Y>sb.b+sb.h)return;
 st={x:(p.X-sb.a)/sb.w,y:(p.Y-sb.b)/sb.h};c.setPointerCapture(e.pointerId);e.preventDefault();
});
c.addEventListener('pointermove',e=>{
 if(!st)return;const p=pos(e);
 const nx=Math.min(1,Math.max(0,(p.X-sb.a)/sb.w)),ny=Math.min(1,Math.max(0,(p.Y-sb.b)/sb.h));
 cur={x:Math.min(st.x,nx),y:Math.min(st.y,ny),w:Math.abs(nx-st.x),h:Math.abs(ny-st.y),s:style};draw();
});
function endDrag(){
 if(!st)return;const s0=st;st=null;
 if(cur&&(cur.w>0.01||cur.h>0.005))rects.push(cur);
 else{for(let i=rects.length-1;i>=0;i--){const r=rects[i];if(s0.x>=r.x&&s0.x<=r.x+r.w&&s0.y>=r.y&&s0.y<=r.y+r.h){rects.splice(i,1);break}}}
 cur=null;draw()}
c.addEventListener('pointerup',endDrag);c.addEventListener('pointercancel',endDrag);
const $=id=>document.getElementById(id);
$('cz').onclick=()=>{censor=!censor;$('cp').style.display=censor?'flex':'none';$('cz').classList.toggle('on',censor);$('cz').textContent=censor?'🙈 โหมดเซ็นเซอร์ (เปิดอยู่)':'🙈 โหมดเซ็นเซอร์ (ปิดอยู่)';c.style.touchAction=censor?'none':'auto'};
function setStyle(s,id){style=s;['s1','s2','s3'].forEach(k=>$(k).classList.toggle('on',k===id))}
$('s1').onclick=()=>setStyle('s','s1');$('s2').onclick=()=>setStyle('m','s2');$('s3').onclick=()=>setStyle('k','s3');
const P={n:{x:.14,y:.225,w:.55,h:.18},q:{x:.755,y:.66,w:.21,h:.255},r:{x:.24,y:.855,w:.5,h:.07}};
function addP(k){if(slip){rects.push({...P[k],s:style});draw()}}
$('pa').onclick=()=>{if(slip){['n','q','r'].forEach(k=>rects.push({...P[k],s:style}));draw()}};
$('pr').onclick=()=>addP('r');
$('pn').onclick=()=>addP('n');
$('pq').onclick=()=>addP('q');
$('un').onclick=()=>{rects.pop();draw()};
$('cl').onclick=()=>{rects=[];draw()};
const f=document.getElementById('file');
document.getElementById('pick').onclick=()=>f.click();
c.onclick=()=>{if(!censor)f.click()};
f.onchange=()=>{const fl=f.files[0];if(!fl)return;const u=URL.createObjectURL(fl),i=new Image();i.onload=()=>{slip=i;rects=[];draw()};i.onerror=()=>{alert('เปิดรูปนี้ไม่ได้ ลองใช้รูปสกรีนช็อตสลิป (PNG/JPG) แทนนะครับ')};i.src=u;f.value=''};
const nt=document.getElementById('note');
try{nt.value=localStorage.getItem('nemo_note')||''}catch(e){}
nt.oninput=()=>{try{localStorage.setItem('nemo_note',nt.value)}catch(e){}draw()};
document.getElementById('dl').onclick=async()=>{if(!slip)return;draw();const b=await new Promise(r=>c.toBlob(r,'image/png'));const u=URL.createObjectURL(b);const l=document.createElement('a');l.href=u;l.download='nemo-slip.png';document.body.appendChild(l);l.click();l.remove()};
document.getElementById('rs').onclick=()=>{slip=null;rects=[];nt.value='';try{localStorage.removeItem('nemo_note')}catch(e){}document.getElementById('out').style.display='none';draw()};
if(document.fonts){document.fonts.load("600 34px Mali").then(()=>document.fonts.load("500 44px Mali")).then(draw).catch(()=>{})}
let cached=null,tm=null;
function prep(){cached=null;clearTimeout(tm);tm=setTimeout(()=>c.toBlob(b=>{if(b)cached=new File([b],'nemo-slip.png',{type:'image/png'})},'image/png'),250)}
function showImg(){
 const o=document.getElementById('out');o.style.display='block';
 o.innerHTML='<b>กดค้างที่รูปด้านล่าง แล้วเลือก “เพิ่มไปยังรูปภาพ / Add to Photos / บันทึกรูปภาพ”</b><br>';
 const im=new Image();im.src=URL.createObjectURL(cached);o.appendChild(im);
 const l=document.createElement('a');l.href=im.src;l.download='nemo-slip.png';l.textContent='หรือดาวน์โหลดเป็นไฟล์';l.style.cssText='display:block;margin-top:8px;color:var(--pk)';o.appendChild(l);
 o.scrollIntoView({behavior:'smooth'});
}
document.getElementById('save').onclick=()=>{
 if(!cached){const o=document.getElementById('out');o.style.display='block';o.textContent='กำลังเตรียมรูป กดอีกครั้งนะครับ';return}
 const file=cached;
 if(navigator.canShare&&navigator.canShare({files:[file]})){
  navigator.share({files:[file]}).catch(e=>{if(!e||e.name!=='AbortError')showImg()});
 }else showImg();
};
</script></body></html>
